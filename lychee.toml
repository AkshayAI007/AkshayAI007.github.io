# Link check over the built site. CI runs:
#   lychee --config lychee.toml --root-dir "$PWD/dist" 'dist/**/*.html'
# Root-relative links (/about) resolve like GitHub Pages: about.html, index.html.
fallback_extensions = ["html"]
index_files = ["index.html"]
include_fragments = true

# LinkedIn answers bots with 999; rate limits (429) are not broken links.
accept = ["200..=299", "429", "999"]
max_retries = 3
retry_wait_time = 4
timeout = 30
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"

exclude = [
  # canonical/OG URLs point at the production origin, which this build becomes
  '^https://akshayai007\.github\.io',
  # Medium serves bots a Cloudflare challenge (403) for every profile URL
  '^https://medium\.com/',
  '^mailto:',
  # lychee can't check fragments on directory-index links (/#systems → index.html);
  # these two anchors are asserted by tests/routes.spec.ts and behaviour.spec.ts
  '/dist[^/]*#(systems|projects)$',
]
