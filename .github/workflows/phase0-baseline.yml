# One-off Phase 0 job for the Astro migration. It needs full internet access
# (Unsplash, the live site), so it runs on GitHub's runners rather than locally:
#   1. tags the current main as v1-static (rollback point)
#   2. downloads the Unsplash photos v1 hotlinked, for self-hosting
#   3. records Lighthouse scores of the live v1 site
# and commits 2 + 3 back to the branch that triggered it.
name: Phase 0 baseline

on:
  push:
    paths:
      - .github/workflows/phase0-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag v1-static
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin v1-static >/dev/null; then
            echo "v1-static already exists"
          else
            git tag -a v1-static db3890ea2dbbc2bf9a99bd7e9da41a5a70a40d12 \
              -m "v1: hand-written static site (rollback point before the Astro migration)"
            git push origin v1-static
          fi

      - name: Fetch photographs
        run: node scripts/fetch-photos.mjs

      - name: Lighthouse the live v1 site
        run: |
          mkdir -p lh
          run() { # label url
            for form in mobile desktop; do
              preset=""; [ "$form" = desktop ] && preset="--preset=desktop"
              for i in 1 2 3; do
                npx -y lighthouse@13.5.0 "$2" $preset --quiet \
                  --chrome-flags="--headless=new --no-sandbox" \
                  --output=json --output-path="lh/$1.$form.$i.json"
              done
            done
          }
          run home "https://akshayai007.github.io/"
          run case-voice-ai "https://akshayai007.github.io/#/case/voice-ai"
          run project-cardiovascular "https://akshayai007.github.io/projects/cardiovascular.html"
          mkdir -p tests/baseline
          node scripts/lighthouse-summary.mjs lh tests/baseline/lighthouse-v1.json

      - name: Commit results
        run: |
          git add src/assets/images/photos tests/baseline/lighthouse-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Phase 0: self-host v1 photos, record v1 Lighthouse baseline"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
