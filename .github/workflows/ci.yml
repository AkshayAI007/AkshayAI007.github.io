# Quality gates. Every pull request (and every push to main) must pass all of
# these; with branch protection requiring them, a failure blocks the merge,
# and deploy.yml only ships a main commit whose CI run succeeded.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Types, schemas & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache optimised images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
      - name: astro check (types + content schemas)
        run: pnpm check
      - name: astro build (warnings fail the build)
        run: |
          pnpm build 2>&1 | tee build.log
          if grep -E '\[(WARN|warn)\]|\bwarning\b' build.log; then echo "::error::build emitted warnings"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Routes, legacy links, a11y, console
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression (≤1% vs base)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check out and build the base branch
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach ../base "${{ github.event.pull_request.base.sha }}"
          if [ -f ../base/package.json ]; then
            (cd ../base && pnpm install --frozen-lockfile && pnpm build)
            echo "BASE_DIR=../base/dist" >> "$GITHUB_ENV"; echo "BASE_KIND=astro" >> "$GITHUB_ENV"
          else
            # the pre-Astro static site: serve the tree as-is
            echo "BASE_DIR=../base" >> "$GITHUB_ENV"; echo "BASE_KIND=legacy" >> "$GITHUB_ENV"
          fi
      - name: Compare every route at 390/768/1440, dark + light
        id: parity
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: |
          node scripts/serve.mjs "$BASE_DIR" 4400 & node scripts/serve.mjs dist 4401 &
          sleep 1
          node scripts/visual-parity.mjs --base http://localhost:4400 --base-kind "$BASE_KIND" --head http://localhost:4401 --max 0.01
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/parity
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx -y @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore

  links:
    name: Links (internal + external)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.20.1
          args: --config lychee.toml --root-dir "${{ github.workspace }}/dist" --no-progress 'dist/**/*.html'
          fail: true
